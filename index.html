<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoiso Synergy League 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#12203a;--mu:#5f6b80;--ac:#1c7c54;--bd:#d9dfe8;--hd:#12203a;--hdt:#f6f7f9;--yl:#f2c230;--rd:#d6403a;--row:#f5f7fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1424;--card:#142038;--tx:#e9eef7;--mu:#97a3ba;--ac:#3dbb83;--bd:#26344f;--hd:#0a1120;--hdt:#e9eef7;--row:#101b30}}
:root[data-theme="dark"]{--bg:#0c1424;--card:#142038;--tx:#e9eef7;--mu:#97a3ba;--ac:#3dbb83;--bd:#26344f;--hd:#0a1120;--hdt:#e9eef7;--row:#101b30}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 40px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.2px}
.banner{display:block;width:100%;height:auto;border-radius:8px;margin:0 0 12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lg{display:inline-block;width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:5px}
h1{font-size:30px;margin:6px 0 2px}
h2{font-size:22px;margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 14px}
nav{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px solid var(--bd)}
nav button{flex:1;background:none;border:0;padding:10px 4px;font:600 15px Barlow,sans-serif;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
nav button.on{color:var(--tx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:440px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--hd);color:var(--hdt);font-weight:600;font-size:13px}
th:first-child,td:first-child{width:34px}
td.t,th.t{text-align:left;width:1%;min-width:110px}
@media(max-width:480px){table{min-width:0}th,td{padding:8px 3px;font-size:14px}th:first-child,td:first-child{width:22px}td.t,th.t{min-width:82px;padding-left:6px}td.pts{font-size:19px}}
td.pts{font:700 20px "Barlow Condensed",sans-serif}
tbody tr:nth-child(even){background:var(--row)}
tbody tr.lead td,.pl.lead{background:#e6dbf8}
.pl.lead{padding:4px 8px;border-radius:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tbody tr.lead td,:root:not([data-theme="light"]) .pl.lead{background:#3b2d63}}
:root[data-theme="dark"] tbody tr.lead td,:root[data-theme="dark"] .pl.lead{background:#3b2d63}
tr.top td:first-child{box-shadow:inset 4px 0 var(--ac)}
input,select,button.b{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.b{cursor:pointer;font-weight:600}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:18px;padding:0 6px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.match .h{text-align:right;font-weight:600}.match .a{font-weight:600}
.sc{display:flex;gap:6px;align-items:center}
.sc input{width:48px;text-align:center;font:700 20px "Barlow Condensed",sans-serif;padding:5px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ev{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}
.mu{color:var(--mu);font-size:13px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.r{margin-left:auto}

.fm{display:grid;gap:8px}.fm input{width:100%}
nav button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card[role=alert]{border-color:var(--rd)}
</style>
</head>
<body>
<div class="wrap">
<img class="banner" alt="Hoiso Synergy League 2026" src="/banner.jpg">
<h1 class="vh">Hoiso Synergy League 2026 · Giải bóng đá 6 đội</h1>
<p class="sub">Đá vòng tròn một lượt: 5 vòng, mỗi vòng 3 trận.</p>
<p class="mu" id="st" role="status"></p>
<nav id="nav"></nav>
<main id="app"></main>
</div>
<script src="/app.js" defer></script>
</body>
</html>
